{% extends "base.html" %}{% block title %}Edit Government Scheme - Vidyasathi{% endblock %}{% block content %}<section class="page-hero"><div class="container"><span class="section-kicker">ADMIN MODULE</span><h1>Edit Government Scheme</h1><p>Update scheme information and save your changes.</p></div></section><section class="section-padding"><div class="container"><form method="POST" class="card p-4"><div class="mb-3"><label class="form-label">Scheme Name</label><input type="text" name="name" class="form-control" value="{{ scheme.name or '' }}" required></div><div class="mb-3"><label class="form-label">Category</label><input type="text" name="category" class="form-control" value="{{ scheme.category or '' }}" required></div><div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" required>{{ scheme.description or '' }}</textarea></div><div class="mb-3"><label class="form-label">Eligibility</label><textarea name="eligibility" class="form-control" rows="3" required>{{ scheme.eligibility or '' }}</textarea></div><div class="mb-3"><label class="form-label">Annual Income Limit</label><input type="number" name="annual_income_limit" class="form-control" value="{{ scheme.annual_income_limit or '' }}"></div><div class="mb-3"><label class="form-label">Deadline</label><input type="date" name="deadline" class="form-control" value="{{ scheme.deadline or '' }}"></div><div class="mb-3"><label class="form-label">Official Link</label><input type="url" name="official_link" class="form-control" value="{{ scheme.official_link or '' }}"></div><button type="submit" class="btn btn-primary">💾 Save Changes</button> <a href="{{ url_for('manage_schemes') }}" class="btn btn-secondary">Cancel</a></form></div></section>{% endblock %}
