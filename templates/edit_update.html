{% extends "base.html" %}{% block title %}Edit Latest Update - Vidyasathi{% endblock %}{% block content %}<section class="page-hero"><div class="container"><span class="section-kicker">ADMIN MODULE</span><h1>Edit Latest Update</h1><p>Update announcement information and save your changes.</p></div></section><section class="section-padding"><div class="container"><form method="POST" class="card p-4"><div class="mb-3"><label class="form-label">Update Title</label><input type="text" name="title" class="form-control" value="{{ update.title or '' }}" required></div><div class="mb-3"><label class="form-label">Update Date</label><input type="date" name="update_date" class="form-control" value="{{ update.update_date or '' }}" required></div><div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4" required>{{ update.description or '' }}</textarea></div><div class="mb-3"><label class="form-label">Official Link</label><input type="url" name="link" class="form-control" value="{{ update.link or '' }}"></div><button type="submit" class="btn btn-primary">💾 Save Changes</button> <a href="{{ url_for('manage_updates') }}" class="btn btn-secondary">Cancel</a></form></div></section>{% endblock %}
